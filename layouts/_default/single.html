{{ define "main" }}
{{ partial "global-filetree.html" . }}

<main class="page-main-content">
  <article class="post-single">
    <header class="post-header">
      <h1 class="post-title">{{ .Title }}</h1>
      {{ with .Params.summary }}
        <div class="post-description">{{ . }}</div>
      {{ end }}
    </header>

    <div class="post-content">
      {{ .Content }}
    </div>
  </article>
</main>
{{ end }}
